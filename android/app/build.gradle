apply plugin: 'com.android.application'

// Signierung: Werte kommen aus android/keystore.properties (nicht im Git) oder,
// falls die Datei fehlt, aus den Umgebungsvariablen ANDROID_KEYSTORE_PATH,
// ANDROID_KEY_ALIAS, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_PASSWORD.
// Beides wird von scripts/release-build.sh aus Infisical befuellt.
def signingProps = new Properties()
def signingPropsFile = rootProject.file('keystore.properties')
if (signingPropsFile.exists()) {
    signingPropsFile.withInputStream { signingProps.load(it) }
}

def signingValue = { String propKey, String envKey ->
    def v = signingProps.getProperty(propKey) ?: System.getenv(envKey)
    return (v == null || v.trim().isEmpty()) ? null : v.trim()
}

def keystorePath = signingValue('storeFile', 'ANDROID_KEYSTORE_PATH')
def keystoreFile = keystorePath == null ? null : file(keystorePath)
def hasReleaseSigning = keystoreFile != null && keystoreFile.exists() &&
        signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD') != null &&
        signingValue('keyAlias', 'ANDROID_KEY_ALIAS') != null

android {
    namespace = "de.ithandwerk.foldpage"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "de.ithandwerk.foldpage"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 3
        versionName "1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile keystoreFile
                storePassword signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                keyAlias signingValue('keyAlias', 'ANDROID_KEY_ALIAS')
                keyPassword signingValue('keyPassword', 'ANDROID_KEY_PASSWORD') ?:
                        signingValue('storePassword', 'ANDROID_KEYSTORE_PASSWORD')
                // minSdk ist 24, damit reicht v2/v3. v1 (JAR-Signatur) braucht nur
                // Android 6 und aelter und wuerde die APK unnoetig aufblaehen.
                enableV1Signing false
                enableV2Signing true
                enableV3Signing true
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
